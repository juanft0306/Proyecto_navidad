<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestra Historia de Amor</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/welcome.css">
    <link rel="stylesheet" href="css/intro-animation.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Canvas de partículas en vivo para el fondo -->
    <canvas id="bg-particles"></canvas>

    <!-- Pantalla de Bienvenida Principal -->
    <main id="welcome-screen" class="welcome-container">
        <div class="welcome-card">
            <div class="glow-orb"></div>
            <span class="badge-tag">♥ NUESTRO ANIVERSARIO ♥</span>
            
            <div class="welcome-content-box">
                <h1 class="welcome-title">Nuestra Historia<br><span class="highlight">Juntos</span></h1>
                <p class="welcome-subtitle">Una aventura interactiva creada segundo a segundo para ti ✨</p>

                <button id="start-btn" class="main-start-btn">
                    <span>COMENZAR LA EXPERIENCIA</span>
                    <div class="btn-shine"></div>
                </button>
            </div>
        </div>
    </main>

    <script src="js/animation.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
