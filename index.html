<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestra Historia de Amor</title>
    
    <!-- Estilos Modulares -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/welcome.css">
    <link rel="stylesheet" href="css/intro-animation.css">

    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

<body>

    <!-- Fondo de estrellas / atmósfera -->

    <!-- 1. PANTALLA DE BIENVENIDA LIMPIA -->

        <div class="welcome-card">

            <div class="welcome-content-box">

                <!-- Botón de Inicio para activar la Gran Animación -->
                <button id="start-btn" class="main-start-btn">
                    <span class="btn-text">PRESIONAR PARA COMENZAR</span>
                    <span class="btn-subtext">▶ PLAY</span>
                </button>
            </div>

        </div>
    </main>

    <!-- Scripts Modulares -->
    <script src="js/animation.js"></script>
    <script src="js/app.js"></script>
