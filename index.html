<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestro Rincón Secreto</title>
    <!-- Estilos -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/welcome.css">
    <!-- Fuente Pixel/Retro opcional -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Contenedor Principal de la Pantalla de Bienvenida -->
    <main id="welcome-screen" class="welcome-container">
        <div class="welcome-content">
            
            <!-- Pequeña animación sutil (icono flotante de 8 bits) -->
            <div class="pixel-icon-container">
                <div class="pixel-heart-mini">❤️</div>
            </div>

            <!-- Título principal -->
            <h1 class="welcome-title">NUESTRO RINCÓN SECRETO</h1>
            
            <!-- Subtítulo o dedicatoria corta -->
            <p class="welcome-subtitle">Un espacio exclusivo para nosotros dos...</p>

            <!-- Botón interactivo para pasar a la gran animación / siguiente fase -->
            <button id="start-btn" class="pixel-btn">ENTRAR</button>
            
        </div>
    </main>

    <!-- Scripts Modulares -->
    <script src="js/welcome.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
