<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para ti...</title>
    <link rel="stylesheet" href="css/intro.css">
</head>
<body>

    <!-- ==========================================
         MÓDULO 1: LA LINTERNA EN LA OSCURIDAD
         ========================================== -->
    <section id="modulo-intro" class="pantalla">
        
        <!-- Pista para saber qué hacer -->
        <div id="instrucciones">Desliza tu dedo como una linterna y encuentra los 3 botones perdidos en la oscuridad...</div>

        <!-- Efecto de Luz (controlado por JS) -->
        <div id="linterna" style="--x: -1000px; --y: -1000px;"></div>

        <!-- 3 Botones Ocultos (No tienen 'top' y 'left' porque JS los pondrá al azar) -->
        <button class="btn-oculto" id="btn-1"></button>
        <button class="btn-oculto" id="btn-2"></button>
        <button class="btn-oculto" id="btn-3"></button>

        <!-- Etiqueta de audio pre-cargada para el sonido al presionar -->
        <audio id="sonido-boton" src="assets/audios/boton.mp3" preload="auto"></audio>

        <!-- El contenido que aparece al final -->
        <div id="contenido-revelado" class="oculto">
            <h1 class="mensaje-amor">Eres la luz que ilumina mi vida...</h1>
            <button id="btn-empezar" class="btn-romantico">Empezar la experiencia</button>
        </div>

        <div id="contenedor-corazones"></div>
    </section>

    <!-- Capa negra global para transiciones modulares -->
    <div id="capa-oscura-final"></div>

    <script src="js/intro.js"></script>
</body>
</html>
