<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para ti...</title>
    <!-- Estilos modulares -->
    <link rel="stylesheet" href="css/intro.css">
    <link rel="stylesheet" href="css/video.css">
</head>
<body>

    <!-- ==========================================
         MÓDULO 1: LA LINTERNA EN LA OSCURIDAD
         ========================================== -->
    <section id="modulo-intro" class="pantalla">
        <div id="instrucciones">Desliza tu dedo como una linterna y encuentra los 3 botones perdidos en la oscuridad...</div>
        <div id="linterna" style="--x: -1000px; --y: -1000px;"></div>

        <button class="btn-oculto" id="btn-1"></button>
        <button class="btn-oculto" id="btn-2"></button>
        <button class="btn-oculto" id="btn-3"></button>

        <audio id="sonido-boton" src="assets/audios/boton.mp3" preload="auto"></audio>

        <div id="contenido-revelado" class="oculto">
            <h1 class="mensaje-amor">Eres la luz que ilumina mi vida...</h1>
            <button id="btn-empezar" class="btn-romantico">Empezar la experiencia</button>
        </div>

        <div id="contenedor-corazones"></div>
    </section>

    <!-- ==========================================
         MÓDULO 2: BOTÓN CON ENLACE EXTERNO
         ========================================== -->
    <section id="modulo-video">
        <div id="contenedor-final-video">
            <div class="corazon-latido">❤️</div>
            <p class="frase-video">Cada segundo a tu lado es mi momento favorito...</p>
            
            <!-- Botón con el enlace directo a tu video de Streamable -->
            <a href="https://streamable.com/wn9u7t" target="_blank" class="btn-romantico" style="text-decoration: none; display: inline-block; margin-bottom: 25px; padding: 15px 35px; background: #e11d48; color: white; border-radius: 30px; font-weight: bold; font-size: 1.2rem; box-shadow: 0 0 20px rgba(225, 29, 72, 0.6);">
                Ver video especial 🎥
            </a>

            <br>
            <!-- Botón para continuar a la siguiente parte -->
            <button id="btn-siguiente-tesoro" style="background: transparent; border: 2px solid white; color: white; padding: 10px 25px; border-radius: 20px; cursor: pointer; font-size: 1rem; font-family: inherit;">
                Continuar la aventura ✨
            </button>
        </div>
    </section>

    <!-- Capa negra global para transiciones -->
    <div id="capa-oscura-final"></div>

    <!-- ==========================================
         SCRIPTS MODULARES
         ========================================== -->
    <script src="js/intro.js"></script>
    <script src="js/video.js" defer></script>
</body>
</html>
