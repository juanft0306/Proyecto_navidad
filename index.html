<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para ti...</title>
    <!-- Enlace exclusivo al diseño del Módulo 1 -->
    <link rel="stylesheet" href="css/intro.css">
</head>
<body>

    <!-- ==========================================
         MÓDULO 1: LA LINTERNA EN LA OSCURIDAD
         ========================================== -->
    <section id="modulo-intro" class="pantalla">
        
        <!-- La capa oscura que actúa como linterna (controlada por JS) -->
        <div id="linterna" style="--x: -1000px; --y: -1000px;"></div>

        <!-- Los 3 botones ocultos (puedes ajustar el top y left para moverlos) -->
        <button class="btn-oculto" id="btn-1" style="top: 20%; left: 30%;"></button>
        <button class="btn-oculto" id="btn-2" style="top: 75%; left: 70%;"></button>
        <button class="btn-oculto" id="btn-3" style="top: 50%; left: 15%;"></button>

        <!-- El contenido que aparece al encontrar los 3 botones -->
        <div id="contenido-revelado" class="oculto">
            <h1 class="mensaje-amor">Eres la luz que ilumina mi oscuridad...</h1>
            <button id="btn-empezar" class="btn-romantico">Empezar la experiencia</button>
        </div>

        <!-- Contenedor vacío donde caerán los corazones -->
        <div id="contenedor-corazones"></div>

    </section>

    <!-- Capa global para el fundido a negro final -->
    <div id="capa-oscura-final"></div>

    <!-- ==========================================
         SCRIPTS 
         ========================================== -->
    <!-- Script exclusivo de la lógica del Módulo 1 -->
    <script src="js/intro.js"></script>
    
</body>
</html>
