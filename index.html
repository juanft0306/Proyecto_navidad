<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestra Historia de Amor</title>
    <!-- Estilos -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/welcome.css">
    <!-- Fuente Retro Pixel -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Fondo de estrellas animadas -->
    <div class="stars-bg"></div>

    <!-- Contenedor Principal con Marco Retro -->
    <main id="welcome-screen" class="welcome-container">
        <div class="welcome-card">
            
            <!-- Encabezado de Edición Especial -->
            <div class="badge-tag">♥ EDICIÓN ESPECIAL 2026 ♥</div>

            <!-- Icono central vibrante -->
            <div class="pixel-icon-container">
                <div class="pixel-heart">❤️</div>
            </div>

            <!-- Título Principal -->
            <h1 class="welcome-title">NUESTRA HISTORIA<br><span class="highlight">DE AMOR</span></h1>
            
            <!-- Subtítulo deslumbrante -->
            <p class="welcome-subtitle">Una aventura interactiva creada con cada segundo de nuestro camino juntos ✨</p>

            <!-- Botón interactivo principal -->
            <button id="start-btn" class="pixel-btn">
                <span class="btn-text">INICIAR AVENTURA</span>
                <span class="btn-subtext">PRESS START</span>
            </button>

            <!-- Pie de página con detalle emotivo -->
            <footer class="welcome-footer">
                <span>PRESS START TO PLAY</span>
            </footer>

        </div>
    </main>

    <!-- Scripts Modulares -->
    <script src="js/welcome.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
