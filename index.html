<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Evitamos que el celular haga zoom y arruine la experiencia -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para ti...</title>
    
    <!-- Estilos modulares -->
    <link rel="stylesheet" href="css/intro.css">
    <link rel="stylesheet" href="css/video.css">
</head>
<body>

    <!-- ==========================================
         MÓDULO 1: LA LINTERNA EN LA OSCURIDAD
         ========================================== -->
    <section id="modulo-intro" class="pantalla">
        <div id="instrucciones">Desliza tu dedo como una linterna y encuentra los 3 botones perdidos en la oscuridad...</div>
        <div id="linterna" style="--x: -1000px; --y: -1000px;"></div>

        <button class="btn-oculto" id="btn-1"></button>
        <button class="btn-oculto" id="btn-2"></button>
        <button class="btn-oculto" id="btn-3"></button>

        <audio id="sonido-boton" src="assets/audios/boton.mp3" preload="auto"></audio>

        <div id="contenido-revelado" class="oculto">
            <h1 class="mensaje-amor">Eres la luz que ilumina mi vida...</h1>
            <button id="btn-empezar" class="btn-romantico">Empezar la experiencia</button>
        </div>

        <div id="contenedor-corazones"></div>
    </section>


    <!-- ==========================================
         MÓDULO 2: LA ANIMACIÓN PAPERCRAFT (VIDEO)
         ========================================== -->
    <!-- Inicia oculto para que no interfiera con la linterna -->
    <section id="modulo-video" style="display: none;">
        
        <!-- Reproductor nativo ocupando toda la pantalla -->
        <video id="video-sorpresa" playsinline style="width: 100vw; height: 100vh; object-fit: cover;">
            <!-- Nota: Aquí está buscando 'sorpresa.mp4'. Si el video en GitHub sigue llamándose '1000261851.mp4', cambia el nombre aquí -->
            <source src="assets/videos/sorpresa.mp4" type="video/mp4">
        </video>

        <!-- Contenedor que aparecerá forzosamente a los 11 segundos -->
        <div id="contenedor-final-video" style="display: none;">
            <div class="corazon-latido">❤️</div>
            <p class="frase-video">Cada segundo a tu lado es mi momento favorito...</p>
            <button id="btn-siguiente-tesoro" class="btn-romantico" style="background: transparent; border: 2px solid white; color: white; padding: 10px 25px; border-radius: 20px; cursor: pointer; font-size: 1rem; font-family: inherit;">
                Continuar la aventura ✨
            </button>
        </div>
    </section>


    <!-- ==========================================
         CAPA OSCURA GLOBAL PARA TRANSICIONES
         ========================================== -->
    <div id="capa-oscura-final"></div>


    <!-- ==========================================
         SCRIPTS UNIFICADOS
         ========================================== -->
    <!-- Agregamos ?v=100 para obligar al celular a borrar la caché y leer el código nuevo -->
    <script src="js/intro.js?v=100"></script>
    
    <!-- Eliminamos la llamada a video.js para evitar el choque de variables -->
</body>
</html>
